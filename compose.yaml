name: sport-tournaments
services:
  TournamentDB:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: pass
      MYSQL_DATABASE: Tournament
      MYSQL_USER: sport
      MYSQL_PASSWORD: pass
    ports: ["3309:3306"]
    volumes: [tournament-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ppass"]
      interval: 5s
      timeout: 5s
      retries: 30
  ParticipantDB:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: pass
      MYSQL_DATABASE: Participant
      MYSQL_USER: sport
      MYSQL_PASSWORD: pass
    ports: ["3310:3306"]
    volumes: [participant-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ppass"]
      interval: 5s
      timeout: 5s
      retries: 30
  RegistrationDB:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: pass
      MYSQL_DATABASE: Registration
      MYSQL_USER: sport
      MYSQL_PASSWORD: pass
    ports: ["3311:3306"]
    volumes: [registration-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ppass"]
      interval: 5s
      timeout: 5s
      retries: 30
  tournamentservice:
    image: sporttournaments-tournament:latest
    build:
      context: .
      dockerfile: src/Tournament/SportTournaments.Tournament.API/Dockerfile
    ports: ["5001:8080"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: Server=TournamentDB;Port=3306;Database=Tournament;User=sport;Password=pass
      Services__ParticipantService: http://participantservice:8080
      Services__RegistrationService: http://registrationservice:8080
    depends_on:
      TournamentDB:
        condition: service_healthy
    restart: on-failure
  participantservice:
    image: sporttournaments-participant:latest
    build:
      context: .
      dockerfile: src/Participant/SportTournaments.Participant.API/Dockerfile
    ports: ["5002:8080"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: Server=ParticipantDB;Port=3306;Database=Participant;User=sport;Password=pass
      Services__TournamentService: http://tournamentservice:8080
      Services__RegistrationService: http://registrationservice:8080
    depends_on:
      ParticipantDB:
        condition: service_healthy
    restart: on-failure
  registrationservice:
    image: sporttournaments-registration:latest
    build:
      context: .
      dockerfile: src/Registration/SportTournaments.Registration.API/Dockerfile
    ports: ["5003:8080"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: Server=RegistrationDB;Port=3306;Database=Registration;User=sport;Password=pass
      Services__TournamentService: http://tournamentservice:8080
      Services__ParticipantService: http://participantservice:8080
    depends_on:
      RegistrationDB:
        condition: service_healthy
    restart: on-failure
volumes:
  tournament-data:
  participant-data:
  registration-data:
